# Stateless JSON API for a separate frontend.
quarkus.http.root-path=/
quarkus.http.auth.proactive=false
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Auth-Provider
quarkus.http.cors.access-control-allow-credentials=false

quarkus.smallrye-openapi.info-title=StoreLab API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=false

# The extension supplies the Firestore client and a container-backed emulator in dev/test.
quarkus.google.cloud.firestore.devservice.enabled=true

# The frontend selects a configured OIDC tenant with X-Auth-Provider; OIDC validates the JWT.
quarkus.oidc.tenant-enabled=false

quarkus.rest-client.notification-api.url=${NOTIFICATION_API_URL:http://localhost:9999}
quarkus.rest-client.notification-api.connect-timeout=500
quarkus.rest-client.notification-api.read-timeout=1000

quarkus.otel.enabled=true
%dev.quarkus.otel.traces.exporter=none
%test.quarkus.otel.traces.exporter=none
%prod.quarkus.otel.traces.exporter=${OTEL_TRACES_EXPORTER:none}
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.google.cloud.firestore.devservice.enabled=true
%test.quarkus.google.cloud.firestore.devservice.enabled=true
%dev.quarkus.google.cloud.project-id=storelab-local
%test.quarkus.google.cloud.project-id=storelab-test
%dev.quarkus.google.cloud.firestore.use-emulator-credentials=true
%test.quarkus.google.cloud.firestore.use-emulator-credentials=true
%prod.quarkus.google.cloud.firestore.use-emulator-credentials=false

# Real provider credentials are unnecessary in dev by default and never stored in Git.
%dev.quarkus.oidc.google.tenant-enabled=${GOOGLE_OIDC_ENABLED:false}
%dev.quarkus.oidc.google.auth-server-url=https://accounts.google.com
%dev.quarkus.oidc.google.application-type=service
%dev.quarkus.oidc.google.client-id=${GOOGLE_CLIENT_ID:}
%dev.quarkus.oidc.google.token.subject-required=true
%dev.quarkus.oidc.google.token.audience=${GOOGLE_CLIENT_ID:}
%dev.quarkus.oidc.apple.tenant-enabled=${APPLE_OIDC_ENABLED:false}
%dev.quarkus.oidc.apple.auth-server-url=https://appleid.apple.com
%dev.quarkus.oidc.apple.application-type=service
%dev.quarkus.oidc.apple.client-id=${APPLE_SERVICES_ID:}
%dev.quarkus.oidc.apple.token.subject-required=true
%dev.quarkus.oidc.apple.token.audience=${APPLE_SERVICES_ID:}

%prod.quarkus.oidc.google.tenant-enabled=true
%prod.quarkus.oidc.google.auth-server-url=https://accounts.google.com
%prod.quarkus.oidc.google.application-type=service
%prod.quarkus.oidc.google.client-id=${GOOGLE_CLIENT_ID}
%prod.quarkus.oidc.google.token.subject-required=true
%prod.quarkus.oidc.google.token.audience=${GOOGLE_CLIENT_ID}
%prod.quarkus.oidc.apple.tenant-enabled=true
%prod.quarkus.oidc.apple.auth-server-url=https://appleid.apple.com
%prod.quarkus.oidc.apple.application-type=service
%prod.quarkus.oidc.apple.client-id=${APPLE_SERVICES_ID}
%prod.quarkus.oidc.apple.token.subject-required=true
%prod.quarkus.oidc.apple.token.audience=${APPLE_SERVICES_ID}
