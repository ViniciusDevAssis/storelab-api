# StoreLab API: REST requests use OIDC-managed browser sessions.
quarkus.http.root-path=/
quarkus.http.auth.proactive=false
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Content-Type
quarkus.http.cors.access-control-allow-credentials=true
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}

# OIDC session and state cookies are scoped to the API root. Local HTTP remains usable.
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.state-cookie-same-site=lax
%dev.quarkus.oidc.authentication.cookie-force-secure=false

%dev.quarkus.oidc.google.authentication.restore-path-after-redirect=true
%prod.quarkus.oidc.google.authentication.restore-path-after-redirect=true

%dev.quarkus.oidc.apple.authentication.restore-path-after-redirect=true
%prod.quarkus.oidc.apple.authentication.restore-path-after-redirect=true

quarkus.smallrye-openapi.info-title=StoreLab API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=false

# The extension supplies the Firestore client and a container-backed emulator in dev/test.
quarkus.google.cloud.firestore.devservice.enabled=true

# No default tenant: OIDC only resolves through /auth/google/* or /auth/apple/*,
# then the Quarkus session cookie carries the selected tenant on later requests.
quarkus.oidc.tenant-enabled=false

quarkus.rest-client.notification-api.url=${NOTIFICATION_API_URL:http://localhost:9999}
quarkus.rest-client.notification-api.connect-timeout=500
quarkus.rest-client.notification-api.read-timeout=1000

quarkus.otel.enabled=true
%dev.quarkus.otel.traces.exporter=none
%test.quarkus.otel.traces.exporter=none
%prod.quarkus.otel.traces.exporter=${OTEL_TRACES_EXPORTER:none}
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=true
%dev.quarkus.google.cloud.firestore.devservice.enabled=true
%test.quarkus.google.cloud.firestore.devservice.enabled=true
%dev.quarkus.google.cloud.project-id=storelab-local
%test.quarkus.google.cloud.project-id=storelab-test
%dev.quarkus.google.cloud.firestore.use-emulator-credentials=true
%test.quarkus.google.cloud.firestore.use-emulator-credentials=true
%prod.quarkus.google.cloud.firestore.use-emulator-credentials=false

# Google Authorization Code Flow. Configure the matching callback in Google Cloud Console.
%dev.quarkus.oidc.google.tenant-enabled=${GOOGLE_OIDC_ENABLED:false}
%dev.quarkus.oidc.google.provider=google
%dev.quarkus.oidc.google.application-type=web-app
%dev.quarkus.oidc.google.client-id=${GOOGLE_CLIENT_ID:}
%dev.quarkus.oidc.google.credentials.secret=${GOOGLE_CLIENT_SECRET:}
%dev.quarkus.oidc.google.authentication.redirect-path=/auth/google/callback
%dev.quarkus.oidc.google.authentication.scopes=email,profile
%dev.quarkus.oidc.google.authentication.cookie-force-secure=false
%dev.quarkus.oidc.google.tenant-paths=/auth/google/*
%dev.quarkus.oidc.google.token.subject-required=true
%dev.quarkus.oidc.google.token.audience=${GOOGLE_CLIENT_ID:}

# Apple stays disabled until all backend-only Apple Developer credentials are supplied.
%dev.quarkus.oidc.apple.tenant-enabled=${APPLE_OIDC_ENABLED:false}
%dev.quarkus.oidc.apple.provider=apple
%dev.quarkus.oidc.apple.application-type=web-app
%dev.quarkus.oidc.apple.client-id=${APPLE_SERVICES_ID:}
%dev.quarkus.oidc.apple.credentials.jwt.key-file=${APPLE_PRIVATE_KEY_PATH:}
%dev.quarkus.oidc.apple.credentials.jwt.token-key-id=${APPLE_KEY_ID:}
%dev.quarkus.oidc.apple.credentials.jwt.issuer=${APPLE_TEAM_ID:}
%dev.quarkus.oidc.apple.credentials.jwt.subject=${APPLE_SERVICES_ID:}
%dev.quarkus.oidc.apple.authentication.redirect-path=/auth/apple/callback
%dev.quarkus.oidc.apple.authentication.scopes=name,email
%dev.quarkus.oidc.apple.authentication.response-mode=form_post
%dev.quarkus.oidc.apple.authentication.cookie-same-site=none
%dev.quarkus.oidc.apple.authentication.state-cookie-same-site=none
%dev.quarkus.oidc.apple.authentication.cookie-force-secure=true
%dev.quarkus.oidc.apple.tenant-paths=/auth/apple/*
%dev.quarkus.oidc.apple.token.subject-required=true
%dev.quarkus.oidc.apple.token.audience=${APPLE_SERVICES_ID:}

# Production requires Google credentials; Apple is opt-in and cannot block startup.
%prod.quarkus.oidc.google.tenant-enabled=${GOOGLE_OIDC_ENABLED:true}
%prod.quarkus.oidc.google.provider=google
%prod.quarkus.oidc.google.application-type=web-app
%prod.quarkus.oidc.google.client-id=${GOOGLE_CLIENT_ID}
%prod.quarkus.oidc.google.credentials.secret=${GOOGLE_CLIENT_SECRET}
%prod.quarkus.oidc.google.authentication.redirect-path=/auth/google/callback
%prod.quarkus.oidc.google.authentication.scopes=email,profile
%prod.quarkus.oidc.google.tenant-paths=/auth/google/*
%prod.quarkus.oidc.google.token.subject-required=true
%prod.quarkus.oidc.google.token.audience=${GOOGLE_CLIENT_ID}
%prod.quarkus.oidc.google.authentication.cookie-same-site=${OIDC_COOKIE_SAME_SITE:none}
%prod.quarkus.oidc.google.authentication.state-cookie-same-site=${OIDC_COOKIE_SAME_SITE:none}
%prod.quarkus.oidc.google.authentication.cookie-force-secure=true

%prod.quarkus.oidc.apple.tenant-enabled=${APPLE_OIDC_ENABLED:false}
%prod.quarkus.oidc.apple.provider=apple
%prod.quarkus.oidc.apple.application-type=web-app
%prod.quarkus.oidc.apple.client-id=${APPLE_SERVICES_ID:}
%prod.quarkus.oidc.apple.credentials.jwt.key-file=${APPLE_PRIVATE_KEY_PATH:}
%prod.quarkus.oidc.apple.credentials.jwt.token-key-id=${APPLE_KEY_ID:}
%prod.quarkus.oidc.apple.credentials.jwt.issuer=${APPLE_TEAM_ID:}
%prod.quarkus.oidc.apple.credentials.jwt.subject=${APPLE_SERVICES_ID:}
%prod.quarkus.oidc.apple.authentication.redirect-path=/auth/apple/callback
%prod.quarkus.oidc.apple.authentication.scopes=name,email
%prod.quarkus.oidc.apple.authentication.response-mode=form_post
%prod.quarkus.oidc.apple.authentication.cookie-same-site=none
%prod.quarkus.oidc.apple.authentication.state-cookie-same-site=none
%prod.quarkus.oidc.apple.authentication.cookie-force-secure=true
%prod.quarkus.oidc.apple.tenant-paths=/auth/apple/*
%prod.quarkus.oidc.apple.token.subject-required=true
%prod.quarkus.oidc.apple.token.audience=${APPLE_SERVICES_ID:}

storelab.frontend.url=${FRONTEND_URL:http://localhost:3000}
%prod.storelab.frontend.url=${FRONTEND_URL}
